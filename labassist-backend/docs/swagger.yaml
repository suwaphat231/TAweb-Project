basePath: /api/v1
definitions:
  admin.AdminStatsResponse:
    properties:
      accepted_applications:
        example: 50
        type: integer
      open_courses:
        example: 5
        type: integer
      pending_applications:
        example: 30
        type: integer
      total_applications:
        example: 200
        type: integer
      total_courses:
        example: 15
        type: integer
      total_instructors:
        example: 10
        type: integer
      total_students:
        example: 80
        type: integer
      total_users:
        example: 100
        type: integer
    type: object
  admin.CreateUserRequest:
    properties:
      full_name:
        example: John Doe
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        example: instructor
    required:
    - full_name
    - role
    type: object
  admin.DeleteCoursesByTermResponse:
    properties:
      deleted:
        example: 12
        type: integer
    type: object
  admin.ImportCourseResult:
    properties:
      code:
        example: CS101
        type: string
      instructor:
        example: John Doe; Jane Doe
        type: string
      row:
        example: 2
        type: integer
      title:
        example: Introduction to Programming
        type: string
    type: object
  admin.ImportCoursesResponse:
    properties:
      created:
        items:
          $ref: '#/definitions/admin.ImportCourseResult'
        type: array
      skipped:
        items:
          $ref: '#/definitions/admin.ImportSkippedRow'
        type: array
    type: object
  admin.ImportSkippedRow:
    properties:
      reason:
        example: empty row
        type: string
      row:
        example: 2
        type: integer
    type: object
  admin.UpdateUserRequest:
    properties:
      full_name:
        example: John Doe
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        example: instructor
    type: object
  admin.UpdateUserStatusRequest:
    properties:
      is_active:
        example: true
        type: boolean
    type: object
  handlers.BulkReviewResponse:
    properties:
      updated:
        example: 3
        type: integer
    type: object
  handlers.DashboardStats:
    properties:
      applied:
        example: 2
        type: integer
      open_courses:
        example: 5
        type: integer
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  handlers.GoogleLoginRequest:
    properties:
      credential:
        example: eyJhbGci...
        type: string
    required:
    - credential
    type: object
  handlers.GoogleLoginResponse:
    properties:
      is_new_user:
        example: false
        type: boolean
      token:
        example: eyJhbGci...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.LoginRequest:
    properties:
      password:
        example: secret
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  handlers.LoginResponse:
    properties:
      token:
        example: eyJhbGci...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.LogsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ActivityLog'
        type: array
      limit:
        example: 50
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
    type: object
  handlers.MeResponse:
    properties:
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.MessageResponse:
    properties:
      message:
        example: ออกจากระบบแล้ว
        type: string
    type: object
  handlers.StudentDashboardResponse:
    properties:
      recent_applications:
        items:
          $ref: '#/definitions/models.Application'
        type: array
      recent_courses:
        items:
          $ref: '#/definitions/models.Course'
        type: array
      stats:
        $ref: '#/definitions/handlers.DashboardStats'
    type: object
  models.ActivityLog:
    properties:
      created_at:
        type: string
      duration_ms:
        type: integer
      id:
        type: integer
      ip:
        type: string
      method:
        type: string
      path:
        type: string
      role:
        type: string
      status_code:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  models.AppStatus:
    enum:
    - pending
    - accepted
    - rejected
    - withdrawn
    type: string
    x-enum-varnames:
    - AppPending
    - AppAccepted
    - AppRejected
    - AppWithdrawn
  models.Application:
    properties:
      applied_at:
        type: string
      course_code:
        type: string
      course_id:
        type: integer
      course_schedule:
        type: string
      course_section:
        type: integer
      course_title:
        type: string
      grade:
        description: |-
          Grade is the letter grade the student earned when they previously took
          this course, self-reported at application time so the instructor can
          check it against the course's minimum-grade requirement.
        type: string
      has_grade_proof:
        description: Computed fields (not in DB)
        type: boolean
      id:
        type: integer
      note:
        type: string
      reviewed_at:
        type: string
      reviewed_by_id:
        type: integer
      reviewed_by_name:
        type: string
      role_applied:
        $ref: '#/definitions/models.RoleApplied'
      status:
        $ref: '#/definitions/models.AppStatus'
      student_code:
        type: string
      student_email:
        type: string
      student_faculty:
        type: string
      student_gpa:
        type: number
      student_id:
        type: integer
      student_name:
        type: string
      student_year:
        type: integer
    type: object
  models.Course:
    properties:
      academic_year:
        type: integer
      applicant_count:
        type: integer
      capacity:
        type: integer
      code:
        type: string
      created_at:
        type: string
      credits:
        type: string
      deadline:
        type: string
      description:
        type: string
      english_title:
        type: string
      enrolled:
        type: integer
      group_note:
        type: string
      has_lab:
        type: boolean
      id:
        type: integer
      instructor_id:
        type: integer
      instructor_name:
        type: string
      instructors_raw:
        description: |-
          InstructorsRaw is the verbatim text of the spreadsheet's instructor
          cell (kept for display as-is, e.g. co-teaching names the system has
          no matching account for) — separate from InstructorID, which only
          ever points to a real, matched user account.
        type: string
      labboy_accepted:
        type: integer
      labboy_slots:
        type: integer
      require_grade_proof:
        description: |-
          RequireGradeProof: when true, a student applying must attach an image
          of their grade (e.g. a MyReg screenshot) instead of just self-reporting
          a letter grade — set per posting so the instructor decides which
          courses need proof against students typing in a fake grade.
        type: boolean
      requirements:
        type: string
      schedule:
        type: string
      section:
        type: integer
      semester:
        type: string
      status:
        $ref: '#/definitions/models.CourseStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.CourseStatus:
    enum:
    - open
    - closing_soon
    - closed
    - draft
    - archived
    type: string
    x-enum-varnames:
    - StatusOpen
    - StatusClosingSoon
    - StatusClosed
    - StatusDraft
    - StatusArchived
  models.Notification:
    properties:
      body:
        type: string
      course_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      title:
        type: string
      user_id:
        type: integer
    type: object
  models.RoleApplied:
    enum:
    - labboy
    type: string
    x-enum-varnames:
    - RoleLabBoy
  models.User:
    properties:
      created_at:
        type: string
      email:
        description: |-
          Email has no gorm uniqueIndex tag: admin-created accounts start with a
          blank email (filled in later via Google sign-in), so uniqueness is
          enforced instead by a partial index that ignores empty strings — see
          database/connection.go.
        type: string
      faculty:
        type: string
      full_name:
        type: string
      google_sub:
        type: string
      gpa:
        type: number
      id:
        type: integer
      is_active:
        type: boolean
      role:
        $ref: '#/definitions/models.UserRole'
      student_id:
        type: string
      updated_at:
        type: string
      username:
        type: string
      year:
        type: integer
    type: object
  models.UserRole:
    enum:
    - student
    - instructor
    - staff
    - admin
    type: string
    x-enum-varnames:
    - RoleStudent
    - RoleInstructor
    - RoleStaff
    - RoleAdmin
  student.ApplyRequest:
    properties:
      course_id:
        example: 1
        type: integer
      grade:
        description: |-
          Grade is the letter grade the student got when they previously took
          this course, so the instructor can check it against the posting's
          minimum-grade requirement.
        example: A
        type: string
      role_applied:
        allOf:
        - $ref: '#/definitions/models.RoleApplied'
        enum:
        - labboy
        example: labboy
    required:
    - course_id
    - role_applied
    type: object
  student.TranscriptResponse:
    properties:
      file_name:
        type: string
      file_size:
        type: integer
      uploaded_at:
        type: string
    type: object
  student.UpdateProfileRequest:
    properties:
      faculty:
        example: วิทยาการคอมพิวเตอร์
        type: string
      full_name:
        example: สมชาย ใจดี
        type: string
      year:
        example: 3
        type: integer
    type: object
  teacher.AddSectionRequest:
    properties:
      schedule:
        example: อ,พฤ 13:00-16:00
        type: string
      section:
        example: 2
        type: integer
    type: object
  teacher.BulkReviewRequest:
    properties:
      application_ids:
        items:
          type: integer
        type: array
      note:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.AppStatus'
        example: accepted
    required:
    - application_ids
    - status
    type: object
  teacher.CreateCourseRequest:
    properties:
      academic_year:
        example: 2567
        type: integer
      code:
        example: CS101
        type: string
      deadline:
        example: "2026-08-01"
        type: string
      description:
        type: string
      labboy_slots:
        example: 2
        type: integer
      require_grade_proof:
        description: |-
          RequireGradeProof: when true, applicants must attach an image of their
          grade instead of just self-reporting it — guards against a typed-in
          fake grade.
        example: false
        type: boolean
      requirements:
        type: string
      sections:
        description: |-
          Sections lists the teaching sections/time slots for this posting. One
          Course row is created per entry; when omitted, a single section with
          no section number/schedule is created (unchanged single-section behavior).
        items:
          $ref: '#/definitions/teacher.SectionInput'
        type: array
      semester:
        example: "1"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.CourseStatus'
        example: draft
      title:
        example: Introduction to Programming
        type: string
    required:
    - academic_year
    - code
    - semester
    - title
    type: object
  teacher.ReviewRequest:
    properties:
      note:
        example: ผ่านการคัดเลือก
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.AppStatus'
        example: accepted
    required:
    - status
    type: object
  teacher.SectionInput:
    properties:
      schedule:
        example: จ,พ,ศ 09:00-12:00
        type: string
      section:
        example: 1
        type: integer
    type: object
  teacher.UpdateCourseRequest:
    properties:
      academic_year:
        example: 2567
        type: integer
      code:
        example: CS101
        type: string
      deadline:
        example: "2026-08-01"
        type: string
      description:
        type: string
      labboy_slots:
        example: 2
        type: integer
      require_grade_proof:
        example: false
        type: boolean
      requirements:
        type: string
      schedule:
        example: จ,พ,ศ 09:00-12:00
        type: string
      section:
        example: 1
        type: integer
      semester:
        example: "1"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.CourseStatus'
        example: open
      title:
        example: Introduction to Programming
        type: string
    type: object
  teacher.UpdateCourseStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/models.CourseStatus'
        example: open
    type: object
  teacher.UpdateInstructorProfileRequest:
    properties:
      email:
        example: somchai@su.ac.th
        type: string
      faculty:
        example: ภาควิชาวิทยาการคอมพิวเตอร์
        type: string
      full_name:
        example: ผู้ช่วยศาสตราจารย์ ดร.สมชาย ใจดี
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API สำหรับระบบจัดการ TA ภาควิชา CS มหาวิทยาลัยศิลปากร
  title: LabAssist API
  version: "1.0"
paths:
  /admin/courses/import:
    post:
      consumes:
      - multipart/form-data
      description: แสดงชื่อผู้สอนตามที่พิมพ์มาในไฟล์เสมอ ระบบพยายามจับคู่ชื่อแรกกับผู้ใช้
        role=instructor ที่มีอยู่จริงเพื่อผูกวิชากับบัญชีนั้น (ให้อาจารย์ล็อกอินดูวิชาของตัวเองได้)
        แต่ถ้าจับคู่ไม่ได้ก็ไม่มีผลต่อการนำเข้า รหัสวิชาซ้ำกันได้ (คนละกลุ่มเรียน)
        มีเพียงแถวที่ว่างจริงๆ เท่านั้นที่จะถูกข้าม
      parameters:
      - description: 'ไฟล์ Excel รายวิชา .xlsx (คอลัมน์: รายวิชา, ชื่อรายวิชา, COURSENAME,
          หน่วยกิต, กลุ่ม, รับ, ลงทะเบียนแล้ว, เวลา, ผู้สอน)'
        in: formData
        name: file
        required: true
        type: file
      - description: ภาคการศึกษา
        in: formData
        name: semester
        required: true
        type: string
      - description: ปีการศึกษา
        in: formData
        name: academic_year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ImportCoursesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: นำเข้ารายวิชาจากไฟล์ Excel (.xlsx)
      tags:
      - admin
  /admin/courses/term:
    delete:
      description: ใช้เพื่อล้างข้อมูลที่นำเข้าผิดพลาด เช่น หลังจากอัปโหลดไฟล์ Excel
        ผิดเทอม
      parameters:
      - description: ภาคการศึกษา
        in: query
        name: semester
        required: true
        type: string
      - description: ปีการศึกษา
        in: query
        name: academic_year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.DeleteCoursesByTermResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ลบวิชาทั้งหมดของภาคการศึกษาที่ระบุ
      tags:
      - admin
  /admin/logs:
    get:
      parameters:
      - description: กรองตาม user ID
        in: query
        name: user_id
        type: integer
      - description: กรองตาม HTTP method
        enum:
        - GET
        - POST
        - PUT
        - DELETE
        in: query
        name: method
        type: string
      - description: หน้า (default 1)
        in: query
        name: page
        type: integer
      - description: จำนวนต่อหน้า (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LogsResponse'
      security:
      - BearerAuth: []
      summary: ดู activity log
      tags:
      - admin
  /admin/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminStatsResponse'
      security:
      - BearerAuth: []
      summary: สถิติภาพรวมของระบบ
      tags:
      - admin
  /admin/users:
    get:
      parameters:
      - description: กรองตาม role
        enum:
        - student
        - instructor
        - staff
        - admin
        in: query
        name: role
        type: string
      - description: ค้นหาด้วยชื่อหรืออีเมล
        in: query
        name: search
        type: string
      - description: จำนวนต่อหน้า (default 100)
        in: query
        name: limit
        type: integer
      - description: ออฟเซ็ต (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
      security:
      - BearerAuth: []
      summary: รายการผู้ใช้ทั้งหมด
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: ข้อมูลผู้ใช้
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: สร้างผู้ใช้ใหม่ (ชื่อ + บทบาทเท่านั้น)
      tags:
      - admin
  /admin/users/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: ข้อมูลที่ต้องการแก้ไข
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: แก้ไขชื่อ/บทบาทผู้ใช้
      tags:
      - admin
  /admin/users/{id}/courses:
    get:
      description: จับคู่ด้วย ID บัญชีโดยตรง และด้วยชื่อกับข้อมูลผู้สอนที่นำเข้าจากไฟล์
        Excel (ครอบคลุมทั้งผู้สอนหลักและผู้ร่วมสอน)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Course'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: รายวิชาที่อาจารย์คนนี้สอน
      tags:
      - admin
  /admin/users/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: สถานะใหม่
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: อัพเดตสถานะผู้ใช้ (เปิด/ปิด)
      tags:
      - admin
  /auth/google:
    post:
      consumes:
      - application/json
      parameters:
      - description: Google credential
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GoogleLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: เข้าสู่ระบบด้วย Google
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: ข้อมูลล็อกอิน
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
