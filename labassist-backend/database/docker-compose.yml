services:
  db:
    build:
      context: ./Docker
      dockerfile: dockerfile
    container_name: TA_mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-labassist}
      MYSQL_USER: ${DB_USER:-labassist}
      MYSQL_PASSWORD: ${DB_PASSWORD:-labassist123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-labassist-root-local}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
