services:
  mysql:
    image: mysql:8.4
    # Allow the application migration account to create consistency triggers
    # with binary logging enabled, without granting it SUPER privileges.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin-trust-function-creators=1"]
    container_name: labassist-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-labassist-root-local}
      MYSQL_DATABASE: ${DB_NAME:-labassist}
      MYSQL_USER: ${DB_USER:-labassist}
      MYSQL_PASSWORD: ${DB_PASSWORD:-labassist123}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    # Object storage for uploaded files (grade sheets, REG cards, grade proofs,
    # report evidence). MinIO no longer publishes images on Docker Hub, so this
    # is Chainguard's build, pinned by digest (MinIO RELEASE.2026-10-23).
    image: cgr.dev/chainguard/minio@sha256:268d68a2a3b6fc65f905a61f84d7eab6345ce6bff14f551e2b028ec31e6a1341
    container_name: labassist-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labassist}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to a generated random secret of at least 8 characters}
    # The S3 API (9000) is reachable only on the internal Docker network. The
    # admin console is bound to localhost only.
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./labassist-backend
      dockerfile: Dockerfile
    container_name: labassist-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      # OCR is optional (profile "ocr"); the backend starts without it and only
      # the document-upload OCR features are unavailable.
      ocr-service:
        condition: service_started
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-labassist}
      DB_PASSWORD: ${DB_PASSWORD:-labassist123}
      DB_NAME: ${DB_NAME:-labassist}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a generated random secret of at least 32 bytes}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEV_LOGIN: ${DEV_LOGIN:-true}
      RESET_DB_ON_START: ${RESET_DB_ON_START:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PORT: 8080
      OCR_SERVICE_URL: http://ocr-service:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-labassist}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-labassist-files}
      S3_USE_SSL: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./labassist-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-true}
    container_name: labassist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  ocr-service:
    # Not started by default. Run with: docker compose --profile ocr up -d
    profiles: ["ocr"]
    build:
      context: ./labassist-ocr
    container_name: labassist-ocr
    # No host-port binding — reachable only on the internal Docker network
    # (backend uses http://ocr-service:8000). Binding 8000 to the host would
    # let anyone on the network call OCR endpoints without authentication.
    volumes:
      - ./labassist-ocr:/app
      - easyocr_models:/root/.EasyOCR
    environment:
      - TZ=Asia/Bangkok
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  easyocr_models:
