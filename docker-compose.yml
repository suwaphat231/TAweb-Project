version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: labassist-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-labassist123}
      MYSQL_DATABASE: ${DB_NAME:-labassist}
      MYSQL_USER: ${DB_USER:-labassist}
      MYSQL_PASSWORD: ${DB_PASSWORD:-labassist123}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-labassist}", "-p${DB_PASSWORD:-labassist123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./labassist-backend
      dockerfile: Dockerfile
    container_name: labassist-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ocr-service:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-labassist}
      DB_PASSWORD: ${DB_PASSWORD:-labassist123}
      DB_NAME: ${DB_NAME:-labassist}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PORT: 8080
      OCR_SERVICE_URL: http://ocr-service:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./labassist-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: labassist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  ocr-service:
    build:
      context: ./labassist-ocr
    container_name: labassist-ocr
    ports:
      - "8000:8000"
    volumes:
      - ./labassist-ocr:/app
      - easyocr_models:/root/.EasyOCR
    environment:
      - TZ=Asia/Bangkok
    restart: unless-stopped

volumes:
  mysqldata:
  easyocr_models: